.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-label {
  padding: 0 4px 0 10px;
  color: rgba(255, 255, 255, 0.55);
  white-space: nowrap;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

const people=[
{id:'qin',label:'秦始皇',dyn:'秦',name:'嬴政',life:'称皇帝：前221—前210',temple:'无',post:'无',era:'无年号',honor:'始皇帝（帝号）',note:'“始皇帝”表达的是从我开始、后面接二世三世的序列。“始皇”不是谥号，也不是年号。秦时还没有后来的年号制度。先秦姓氏制度与后世不同，这里使用通行称呼“嬴政”。',lesson:'不是每个皇帝都能填满这五个字段。',source:'qin'},
{id:'han',label:'汉武帝',dyn:'西汉',name:'刘彻',life:'在位：前141—前87',temple:'世宗',post:'孝武皇帝（简称武帝）',era:'建元、元光等',honor:'本例不展开',note:'“汉”定位王朝，“武帝”来自谥号。刘彻有多个年号；传统纪年表把建元元年列为前140年。早期年号的实际命名与追记过程有学术讨论，不宜讲成登基当天发明了一套现成制度。',lesson:'谥号可以成为今天最常用的称呼。',source:'han'},
{id:'tang',label:'唐太宗',dyn:'唐',name:'李世民',life:'在位：626—649',temple:'太宗',post:'文皇帝（初谥）',era:'贞观（627—649）',honor:'天可汗（特定政治语境的尊称）',note:'626年即位，627年才开始贞观纪年。初谥为“文皇帝”，后世多次加谥，754年加为“文武大圣大广孝皇帝”。“天可汗”涉及诸部拥戴的政治关系，不等同于朝廷册上的全部尊号。',lesson:'即位年不一定就是年号元年，身后称号也有版本。',source:'tang'},
{id:'xuanzong',label:'唐玄宗',dyn:'唐',name:'李隆基',life:'在位：712—756',temple:'玄宗',post:'至道大圣大明孝皇帝',era:'先天、开元、天宝',honor:'开元神武皇帝（713年所上）',note:'在“开元三年”里，开元是年号；在“开元神武皇帝”这一整串里，它是尊号的一部分。判断类别要看用途与上下文，不能只看两个字。',lesson:'同样的字，可以出现在不同类别的称号中。',source:'honor'},
{id:'hongwu',label:'洪武帝',dyn:'明',name:'朱元璋',life:'在位：1368—1398',temple:'太祖',post:'高皇帝（谥号末段简称）',era:'洪武（1368—1398）',honor:'本例不展开',note:'“洪武”是年号。“明太祖”和“洪武帝”都能指朱元璋，前者使用庙号，后者使用年号。明清的一帝一元惯例，让年号常能充当人物简称。',lesson:'年号本来标时间，稳定之后也能顺便指人。',source:'mingwu'},
{id:'yongle',label:'永乐帝',dyn:'明',name:'朱棣',life:'在位：1402—1424',temple:'太宗 → 成祖（1538年改）',post:'文皇帝（谥号末段简称）',era:'永乐（1403—1424）',honor:'本例不展开',note:'1402年登基，次年才开始永乐纪年。去世后原庙号为太宗，嘉靖十七年（1538）改为成祖。因此“成祖”不是他在世时的自称。',lesson:'庙号也能被后来的政治权力改写。',source:'ming'},
{id:'ying',label:'明英宗',dyn:'明',name:'朱祁镇',life:'在位：1435—1449、1457—1464',temple:'英宗',post:'睿皇帝（谥号末段简称）',era:'正统（1436—1449）、天顺（1457—1464）',honor:'本例不展开',note:'被俘后失去皇位，后来复位，重新使用天顺年号。一个人有两段在位经历，也有两个年号。这是明代一帝一元惯例的著名例外。',lesson:'“明清常一帝一元”是惯例，不是没有例外的定律。',source:'ying'},
{id:'kangxi',label:'康熙帝',dyn:'清',name:'爱新觉罗·玄烨',life:'在位：1661—1722',temple:'圣祖',post:'仁皇帝（谥号末段简称）',era:'康熙（1662—1722）',honor:'本例不展开',note:'玄烨1661年即位，1662年才开始康熙纪年。“康熙”不是他的姓名，“圣祖”也不意味着他是清朝第一个皇帝。不能把“祖”字当成开国身份的充分条件。',lesson:'一个常用简称，只取了这个人的某一个字段。',source:'qing'}];
const concepts=[
{key:'name',label:'姓名',q:'他本人叫什么？',short:'识别人',logic:'姓名指向这个人，不是统治时期，也不是后来的评价。帝王名讳常受避讳影响，史书中也会有改名、异写。',ex:'李世民、刘彻、朱棣、玄烨，都是人的姓名。',boundary:'姓名也可能改变；不能把任何字段都当成永远不变的身份证号。',icon:'person'},
{key:'era',label:'年号',q:'这一年按什么名称计数？',short:'标时间',logic:'把某段年份命名，再从元年、二年往下计数。改元就换计数起点。它既是纪年工具，也能表达统治者的政治愿望。',ex:'“贞观三年”是贞观这套计数的第3年，即629年。',boundary:'一人可用多个年号；年号也可能重名或被继承沿用。单有年号不保证唯一定位。',icon:'calendar'},
{key:'temple',label:'庙号',q:'在祖先祭祀体系里叫什么？',short:'定宗庙称呼',logic:'通常在人去世后，由后来的朝廷为他确定宗庙祭祀中的称号，常以“祖”“宗”结尾。它也表达王朝怎样安排自身的历史谱系。',ex:'唐太宗的“太宗”、明成祖的“成祖”、清圣祖的“圣祖”。',boundary:'不是只有开国皇帝才能称“祖”；也不是所有时代的每个皇帝都有庙号。',icon:'temple'},
{key:'post',label:'谥号',q:'后来怎样评价、尊崇他？',short:'作身后评价',logic:'通常在去世后议定，以用字概括、评价或褒扬。早期有美谥、恶谥，后来帝王谥号常越加越长，也可以被改定或加谥。',ex:'汉武帝的“武”来自谥号；李世民的初谥是“文皇帝”。',boundary:'这是特定权力作出的评价，不是独立评审给出的客观分数。',icon:'document'},
{key:'honor',label:'尊号',q:'怎样尊崇、抬高他的地位？',short:'表尊崇',logic:'尊崇性的称号，常由臣下请上，生前就可加上，也有追尊等情形。它与谥号在用字、组合和文献称法上会重叠，不能硬切成互不相交的五个盒子。',ex:'李隆基在713年受上“开元神武皇帝”尊号。',boundary:'尊号不等于谥号，也不能单凭字数或“皇帝”两个字判断类别。',icon:'seal'}];
const years=[{name:'贞观',person:'李世民',start:627,end:649},{name:'开元',person:'李隆基',start:713,end:741},{name:'天宝',person:'李隆基',start:742,end:756},{name:'洪武',person:'朱元璋',start:1368,end:1398},{name:'永乐',person:'朱棣',start:1403,end:1424},{name:'正统',person:'朱祁镇',start:1436,end:1449},{name:'天顺',person:'朱祁镇',start:1457,end:1464},{name:'康熙',person:'玄烨',start:1662,end:1722}];
const eras=[
{name:'秦',year:'前221',title:'先有皇帝，后有年号。',desc:'秦始皇称“始皇帝”，希望后继者接着称二世、三世。他还反对臣子与子孙通过谥号评价君父。这里的“始皇”是序列式帝号。',point:'不存在一套从秦到清都不变的称号模板。',ids:['qin'],source:'qin'},
{name:'汉',year:'前140',title:'给年份起名字。',desc:'传统纪年表以建元为汉武帝的第一个年号。用“年号＋第几年”定位时间，后来形成延续很久的制度。早期年号存在追记与命名时点的讨论。',point:'“汉武帝”指人，“建元三年”指时间。',ids:['han'],source:'years'},
{name:'唐',year:'627',title:'称呼逐渐变长。',desc:'唐代皇帝常有庙号，长谥号和加尊号也日益显著。用“唐太宗”比背一串长谥号方便；这解释了常见叫法，却不意味着唐以前绝无庙号。',point:'李世民只有一个年号；李隆基有多个。',ids:['tang','xuanzong'],source:'tangshi'},
{name:'明',year:'1368',title:'年号，开始常常指人。',desc:'明清通常一帝一元。一个统治者长时间对应一个年号，年号就容易成为他的通行简称。但朱祁镇复位改用天顺，提示我们别把惯例当定律。',point:'洪武帝＝朱元璋；永乐帝＝朱棣。',ids:['hongwu','yongle','ying'],source:'ying'},
{name:'清',year:'1662',title:'“康熙”是时间，也是简称。',desc:'康熙元年始于1662年，玄烨即位则在1661年。清圣祖、康熙帝和玄烨，说的是同一个人，分别选了庙号、年号和姓名。',point:'即位时间与改元时间，要分开看。',ids:['kangxi'],source:'qing'}];
let labPerson=2,labField=1,eraIndex=2;
function icon(type){const paths={person:'<circle cx="20" cy="12" r="5"/><path d="M9 33v-6c0-7 22-7 22 0v6"/>',calendar:'<rect x="6" y="9" width="28" height="26" rx="3"/><path d="M6 17h28M13 5v9M27 5v9M13 24h5M23 24h4M13 29h5"/>',temple:'<path d="M4 16l16-11 16 11H4zm5 2v15m8-15v15m6-15v15m8-15v15M4 35h32"/>',document:'<path d="M10 4h15l7 7v25H10zM24 4v9h8M15 20h12M15 26h12M15 31h8"/>',seal:'<rect x="7" y="7" width="26" height="26" rx="3"/><path d="M13 12v16m7-16v16m7-16v16M12 16h16M12 24h16"/>'};return '<svg class="icon" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'+paths[type]+'</svg>'}
function source(key,label='查看依据'){return `<a class="source" href="${sources[key]}" target="_blank" rel="noopener">${label} ↗</a>`}
function header(issue){return `<header class="mast"><a class="brand" href="#"><span class="seal">帝</span><span><span class="brand-title">帝号</span><small>把历史的称呼读明白</small></span></a><span class="issue">概念小册 · ${issue}<br><span class="num" data-version>v__APP_VERSION__</span></span></header>`}
function diagram(person='李世民',era='贞观',temple='太宗',post='文皇帝'){return `<svg class="illustration" viewBox="0 0 340 225" role="img" aria-label="${person}是同一个人，年号${era}、庙号${temple}和谥号${post}分别有不同用途"><g stroke="#a1ad96" stroke-width="1.2" fill="none"><path d="M170 93v26M170 119H59v25M170 119v25M170 119h111v25"/></g><rect x="111" y="30" width="118" height="64" rx="5" fill="#405b43"/><text x="170" y="53" fill="#d0dbc6" font-size="11" text-anchor="middle">姓名 / 同一个人</text><text x="170" y="78" fill="white" font-size="23" text-anchor="middle">${person}</text>${[[59,era,'年号 / 纪年'],[170,temple,'庙号 / 祭祀'],[281,post,'谥号 / 评价']].map(([x,n,l])=>`<rect x="${x-51}" y="144" width="102" height="66" rx="4" fill="#f5f3ed"/><text x="${x}" y="169" fill="#405b43" font-size="18" text-anchor="middle">${n}</text><text x="${x}" y="191" fill="#70756b" font-size="10" text-anchor="middle">${l}</text>`).join('')}</svg>`}
function timeArt(){return `<svg class="illustration" viewBox="0 0 360 190" role="img" aria-label="从秦汉到明清，常用称呼从帝号、谥号、庙号到年号发生变化，趋势不表示绝对规则"><path d="M23 88H336" stroke="#a1ad96"/><g fill="#405b43">${[32,109,186,263,332].map(x=>`<circle cx="${x}" cy="88" r="5"/>`).join('')}</g>${[['秦',32,'帝号'],['汉',109,'谥号'],['唐',186,'庙号'],['明',263,'年号'],['清',332,'年号']].map(([d,x,n])=>`<text x="${x}" y="62" font-size="22" fill="#405b43" text-anchor="middle">${d}</text><text x="${x}" y="120" font-size="12" fill="#70756b" text-anchor="middle">${n}</text>`).join('')}<text x="180" y="162" text-anchor="middle" font-size="11" fill="#70756b">今天常见的叫法 ≠ 当时唯一的称呼</text></svg>`}
function conceptPanel(i){let c=concepts[i];return `<div class="enter">${icon(c.icon)}<div class="overline">${c.label} / ${c.short}</div><h3>${c.q}</h3><p>${c.logic}</p><p class="small">例如：${c.ex}</p><div class="callout">边界：${c.boundary}</div></div>`}
function editorial(){return `<div class="wrap editorial">${header('图解阅读')}<main class="main"><section class="hero"><div><div class="eyebrow"><span class="dot"></span><span class="overline">第一课 / 五种称呼，一套逻辑</span></div><h1>一个皇帝，<br>为什么有<br><em>这么多名字？</em></h1><p class="lede">李世民、唐太宗、贞观。<br>先别背：它们回答的根本不是同一个问题。</p><a class="btn primary" href="#logic">从一个人读起 <span>↓</span></a><div class="rail"><div><b>5 种</b><span>不同用途</span></div><div><b>16 人</b><span>贯通举例</span></div><div><b>4 题</b><span>检查理解</span></div><div><b>随时查</b><span>参考年表</span></div></div></div><figure class="hero-figure" style="margin:0"><span class="hero-number" aria-hidden="true">01</span><div class="overline">同一个人 / 不同字段</div>${diagram()}<figcaption class="figcap">原创关系示意图：三个称呼并不是三个人</figcaption></figure></section><div class="reading-grid"><aside class="reading-index"><span class="num">READING MAP</span><a href="#logic">01 拆开一个称呼</a><a href="#five">02 五个问题</a><a href="#boundary">03 看看例外</a><a href="#examples">04 对照人物</a><a href="#quiz">05 试一试</a></aside><div class="reading-body"><section id="logic"><div class="overline">01 / 先看用途</div><h2>不是五个外号，<br>是五种信息。</h2><p>读到“唐太宗文皇帝”，可以这样拆：</p><div class="split-name"><span>唐<small>哪个王朝</small></span><span>太宗<small>庙号：宗庙称呼</small></span><span>文皇帝<small>初谥：身后评价</small></span></div><p class="large-line">这些信息，都指向李世民。<br>而“贞观三年”，是在告诉你时间。</p><div class="life-track"><div><span>在世时</span><b>姓名、年号、尊号</b><span>身份、纪年、尊崇</span></div><div><span>通常在去世后</span><b>庙号、谥号</b><span>祭祀、评价与褒扬</span></div></div><p class="small">这是入门模型。追尊、加谥和制度变化会让边界交叠；不是每位皇帝都有全部字段。</p>${source('tangshi','故宫研究资料：李世民初谥与加谥')}</section><section class="section" id="five"><div class="section-head"><h2>五个问题，分开问。</h2><span class="num">02</span></div><p class="small">点一个称呼，看它到底在解决什么问题。</p><div class="chips" role="group" aria-label="选择称号概念">${concepts.map((c,i)=>`<button class="chip" data-concept="${i}" aria-pressed="${i===1}">${c.label}</button>`).join('')}</div><div class="concept-panel" id="concept-panel" aria-live="polite">${conceptPanel(1)}</div></section><section class="section" id="boundary"><div class="section-head"><h2>用反例，检验规则。</h2><span class="num">03</span></div><details open><summary>一个皇帝，只能有一个年号？</summary><p>不是。李隆基用过先天、开元、天宝。明清通常一帝一元，但朱祁镇两次在位，分别用了正统、天顺。</p>${source('ying','故宫：朱祁镇的两次在位')}</details><details><summary>庙号带“祖”，就是开国皇帝？</summary><p>不能这样反推。玄烨的庙号是圣祖，但他不是清朝的第一位皇帝。“祖”“宗”还承载后继者对功业与谱系的安排。</p>${source('qing','故宫：清圣祖玄烨')}</details><details><summary>叫“文皇帝”，是公认他最有文化？</summary><p>谥号是后来的朝廷在特定政治语境中议定的褒贬或尊崇性称号。它不是现代学术评审，更不是可以跨朝代排序的考试分数。</p></details></section></div></div>${common()}</main></div>`}
function board(){let p=people[labPerson];return `<div class="board-head"><div><span class="overline">${p.dyn} / ${p.life}</span><h2>${p.label}</h2></div><span class="tag">同人异称</span></div><div class="board-grid"><figure class="diagram-name" style="margin:0">${labDiagram(p)}<figcaption class="figcap">示意：人物与称号的对应关系</figcaption></figure><div class="field-stack" role="group" aria-label="选择人物称号字段">${concepts.map((c,i)=>`<button class="field-btn" data-field="${i}" aria-pressed="${labField===i}"><span>${c.label} · ${c.short}</span><b>${p[c.key]}</b></button>`).join('')}</div></div><div class="lab-detail" aria-live="polite">${labDetail()}</div>`}
function labDiagram(p){return `<svg class="illustration" viewBox="0 0 250 220" role="img" aria-label="${p.name}是人物主体，周围五类字段可选"><circle cx="125" cy="110" r="76" fill="none" stroke="#b4c0ab" stroke-dasharray="4 6"/><path d="M125 34v24M201 110h-24M125 186v-24M49 110h24" stroke="#a1ad96"/><circle cx="125" cy="110" r="52" fill="#405b43"/><text x="125" y="98" text-anchor="middle" fill="#d0dbc6" font-size="11">同一个人</text><text x="125" y="124" text-anchor="middle" fill="white" font-size="${p.id==='kangxi'?14:21}">${p.name}</text><g fill="#405b43" font-size="11" text-anchor="middle"><text x="125" y="23">姓名</text><text x="221" y="114">年号</text><text x="125" y="207">庙号 / 谥号</text><text x="29" y="114">尊号</text></g></svg>`}
function labDetail(){let p=people[labPerson],c=concepts[labField];let custom={name:`${p.name}是这里采用的通行姓名。${p.id==='qin'?'先秦的姓、氏、名与后世不同，别把现代姓名结构直接套上去。':'为了避讳，过去的人常不直接书写或直呼君主的名字。'}`,era:p.id==='qin'?'秦没有这里讲的年号制度。“始皇二十六年”是按君主在位年次计数，不是一个叫“始皇”的年号。':`本例年号：${p.era}。它首先用来标记时间；今天也可能用来称呼这个人。`,temple:p.temple==='无'?'这个例子没有庙号。不必为了让表格整齐，硬给他补一个。':`本例庙号：${p.temple}。注意它的使用时间和后来的变更；今天的简称未必在他生前就存在。`,post:p.post==='无'?'秦始皇反对谥法。这正好说明：后来的谥号制度不能原样套到每个时代。':`本例谥号：${p.post}。${p.id==='tang'?'这里展示初谥；后来的完整谥号有加长版本。':p.id==='han'?'常见称呼“汉武帝”取的正是这一字段。':p.id==='xuanzong'?'这是一串身后谥号，和生前所上的尊号要分开看。':'明清皇帝的全谥很长，这里显示有标注的末段简称。'}`,honor:p.id==='xuanzong'?'开元神武皇帝是群臣请上的尊号。“开元”作为这一整串的一部分，与“开元三年”中的年号用途不同。':p.id==='tang'?'“天可汗”是诸部拥戴背景下的尊称；不能用它替代所有朝廷正式尊号。':p.id==='qin'?'“始皇帝”是他确定的帝号。它不应被机械归类成后世典型的长尊号。':'本原型不枚举这位皇帝的尊号。“不展开”代表没有在本例展示，不代表历史上没有。'};return `<span class="overline">${c.label} / 用途判断</span><h3>${c.q}</h3><p>${custom[c.key]}</p><div class="callout">${p.lesson}</div><p class="note">${p.note}</p>${source(p.source,'人物依据')}${p.id==='tang'?source('tangshi','初谥与加谥依据'):''}`}
function lab(){return `<div class="wrap lab">${header('称呼实验台')}<main class="main"><div class="lab-intro"><div><div class="eyebrow"><span class="dot"></span><span class="overline">换个人，看看规则还能不能用</span></div><h1>把称呼拆开看。</h1><p class="muted" style="margin:0">先选一个人，再点一个字段。别急着背名字。</p></div><span class="lab-label">8 个人物 × 5 类信息</span></div><div class="lab-layout"><aside class="people-list" aria-label="选择皇帝"><span class="overline">选择人物</span>${people.map((p,i)=>`<button class="person-btn" data-person="${i}" aria-pressed="${labPerson===i}"><span>${p.label}<small>${p.dyn} · ${p.name}</small></span><span class="arrow">↗</span></button>`).join('')}</aside><section class="lab-board" id="lab-board">${board()}</section></div><div class="lab-bottom"><section class="card"><div class="section-head"><h2>年号不是身份证。</h2>${icon('calendar')}</div><p>人物到年号，可以是一对多。年号到人物，也不保证全球唯一。</p><div class="connections"><b>朱祁镇</b><span>→</span><b>正统</b><span>＋</span><b>天顺</b></div><p class="small">“至元”也被不止一位皇帝使用过。所以查日期要带上王朝、人物和具体年次。</p>${source('repeat','故宫：“至元”的重名例子')}</section><section class="card">${calculator()}</section></div>${common()}</main></div>`}
function eraPanel(){let e=eras[eraIndex];return `<article class="era-story enter"><span class="overline">${e.name} / 一个关键变化</span><div class="era-year">${e.year}<span class="small"> ${e.year.startsWith('前')?'年':'年 · 公元'}</span></div><h2>${e.title}</h2><p>${e.desc}</p><div class="callout">${e.point}</div>${source(e.source,'查看这一节点的依据')}<p class="figcap">节点是学习锚点，不是制度全部形成的精确时刻。</p></article><div class="era-examples">${e.ids.map(id=>{let p=people.find(p=>p.id===id);return `<article class="card enter"><div class="mini-person"><h3>${p.label}</h3><span class="small">${p.name}</span></div><dl class="identity"><dt>年号</dt><dd>${p.era}</dd><dt>庙号</dt><dd>${p.temple}</dd><dt>谥号</dt><dd>${p.post}</dd>${p.id==='xuanzong'?`<dt>尊号</dt><dd>${p.honor}</dd>`:''}</dl><p class="note">${p.note}</p>${source(p.source)}</article>`}).join('')}</div>`}
function timeline(){return `<div class="wrap timeline">${header('时间里的称呼')}<main class="main"><section class="time-hero"><div><div class="eyebrow"><span class="dot"></span><span class="overline">把规则放回它的时代</span></div><h1>同样是皇帝，<br>叫法为什么变了？</h1><p class="lede">从“秦始皇”到“康熙帝”，<br>不是大家随便换了个叫法。</p><div class="anchor-list"><a href="#era-nav">看制度变化 ↓</a><a href="#reference-years">查参考年表 ↗</a></div></div><figure class="time-art" style="margin:0">${timeArt()}<figcaption class="figcap">通行称呼的概括趋势 · 并非排他的朝代规则</figcaption></figure></section><div class="era-nav" id="era-nav" role="tablist" aria-label="选择历史阶段">${eras.map((e,i)=>`<button class="era-btn" data-era="${i}" id="era-tab-${i}" role="tab" aria-selected="${eraIndex===i}" aria-controls="era-panel" tabindex="${eraIndex===i?0:-1}"><b>${e.name}</b><span>${e.year}</span></button>`).join('')}</div><section class="era-display" id="era-panel" role="tabpanel" aria-labelledby="era-tab-${eraIndex}">${eraPanel()}</section><div class="era-tools"><section class="card"><h2>先分清五个问题。</h2><div class="chips" role="group" aria-label="选择称号概念">${concepts.map((c,i)=>`<button class="chip" data-concept="${i}" aria-pressed="${i===1}">${c.label}</button>`).join('')}</div><div class="concept-panel" id="concept-panel" aria-live="polite">${conceptPanel(1)}</div></section><section class="card">${calculator()}</section></div>${common()}</main></div>`}
function calculator(){return `<div class="section-head"><h2>把年号换成年份。</h2><span class="num">n → YEAR</span></div><p class="small">同一连续年号内：起始公元年 ＋ 年次 − 1。</p><div class="year-form"><label>年号<select id="year-era">${years.map((y,i)=>`<option value="${i}">${y.name} · ${y.person}</option>`).join('')}</select></label><label>第几年<input id="year-num" type="number" inputmode="numeric" min="1" max="23" value="3"></label></div><div class="equation" id="year-answer" aria-live="polite">${calcResult(0,3)}</div><p class="small">只换算纪年所属的公元年份，不换算月日。农历年与公历年不完全重合，具体日期仍需历表；跨公元前后、改元当年和追改纪年另有边界。</p>${source('years','商务印书馆《辞源》历代建元表')}`}
function calcResult(i,n){let y=years[i],max=y.end-y.start+1;if(!Number.isInteger(n)||n<1||n>max)return `<span>请输入 1—${max} 的整数年次。</span>`;return `<span class="overline">${y.name}${n===1?'元':n}年 · ${y.person}</span><strong>${y.start} + ${n} − 1 = ${y.start+n-1}</strong><span class="small">公元 ${y.start+n-1} 年</span>`}

function yearSpan(a,b){const y=n=>n<0?'前'+Math.abs(n):String(n);return a===b?y(a):y(a)+'至'+y(b)}
function references(){return `<section class="section" id="examples"><div class="section-head"><h2>16 人，一眼对照。</h2><span class="num">QUICK LOOK</span></div><p class="small">这里只放短称呼。完整年号、谥号全称和版本变化在下方清单。</p><nav class="reference-links" aria-label="资料区导航"><a href="#catalogue">查看完整清单 ↓</a><a href="#more-examples">更多例子 ↓</a><a href="#reference-years">32 条年号记录 ↓</a></nav><div class="search"><label for="person-search">找人物</label><input id="person-search" type="search" placeholder="姓名、王朝或称呼，如：皇太极" autocomplete="off"></div><p id="search-status" class="small" aria-live="polite">16 位代表人物 · 全部显示</p><div class="comparison-shell" id="reference-grid"><table class="comparison-table"><caption>谥号栏省去“皇帝”二字，初谥单独标注；“未列实例”不等于“没有”。</caption><thead><tr><th scope="col">人物 / 姓名</th><th scope="col">年号</th><th scope="col">庙号</th><th scope="col">谥号简称</th><th scope="col">尊号等实例</th></tr></thead><tbody>${catalogue.map((p,i)=>`<tr data-ref="${i}"><th scope="row"><div class="comparison-person">${p.label}</div><div class="comparison-name">${p.name} · ${p.dyn}</div><span class="comparison-hint">${p.badge}</span></th>${[['年号',p.shortEra],['庙号',p.shortTemple],['谥号简称',p.shortPost],['尊号等实例',p.shortHonor]].map(([l,v])=>`<td><span class="field-label">${l}</span><span class="comparison-value ${v.includes('→')||p.id==='ying'&&l==='年号'?'changed':''}">${v}</span></td>`).join('')}</tr>`).join('')}</tbody></table></div><p class="small" style="margin-top:12px">→ 表示后来的改定。秦始皇的“始皇帝”是帝号；唐太宗的“天可汗”是特定政治语境的尊称，不能与朝廷正式尊号完全等同。</p></section>`}

{title:'为什么一会儿唐太宗，一会儿汉武帝？',equation:'唐 ＋ 太宗〔庙号〕<br>汉 ＋ 武帝〔谥号简称〕<br>康熙 ＋ 帝〔年号代称〕',body:'后人选择了不同的称呼字段。这些词不在同一分类里，但都能用来指人。明清一帝一元的惯例，使年号更容易成为人物简称；这是通行习惯，不是三条排他规则。',source:'https://www.dpm.org.cn/court/lineage/226256.html'},
{title:'唐太宗与清太宗，是同一个人？',equation:'唐太宗 → 李世民<br>清太宗 → 皇太极',body:'不是。“太宗”会跨王朝重复。就像不同公司都能有“董事长”，身份标签不能脱离所属组织使用。先补上王朝，再落实到姓名。皇太极还有天聪、崇德两个年号。',source:'https://www.dpm.org.cn/court/lineage/226251.html'},
{title:'汉武帝为什么要列 11 个年号？',equation:'同一个刘彻 → 11 个纪年名称<br>建元三年 → 传统纪年表中的前138年',body:'年号不是给人命名，而是给一段年份命名，所以换年号并不意味着换皇帝。建元、元光、元朔等都归于同一人。早期名称还有追命名的讨论，不能把表中的起始年直接当成命名当年的证据。',source:'https://ctext.org/wiki.pl?chapter=736119&if=gb'},
{title:'“至元二年”，为什么可能有两个答案？',equation:'忽必烈的至元二年 → 1265<br>元惠宗的至元二年 → 1336',body:'同一个年号字样，也可能被不同人使用。故宫“至元”词条明确列出两段：1264至1294、1335至1340。只拿两个字做查询键，会把两个时代合并；还要带上人物与王朝。',source:'https://www.dpm.org.cn/lemmas/243267.html'},
{title:'626年登基，为什么贞观元年是627年？',equation:'即位年：626<br>年号元年：627<br>贞观三年：627 ＋ 3 − 1 ＝ 629',body:'新皇帝可以在当年继续沿用前任纪年，再到下一年改元。玄烨1661年即位、康熙元年1662年，朱棣1402年即位、永乐元年1403年，也是类似例子。因此在位年份和年号年份必须分列。',source:'https://www.dpm.org.cn/court/lineage/226257.html'},

{title:'朱棣死后，称号还能继续变？',equation:'1424年：太宗 / 文皇帝<br>1538年：成祖 / 改定后的长谥',body:'可以。庙号是后继朝廷处理王朝祭祀与谱系的称号，不是本人永远不变的昵称。朱棣被改称成祖时已经去世一百多年。李世民的谥号也从文皇帝逐次加长，说明身后称号有版本。',source:'https://www.dpm.org.cn/court/lineage/226257.html'},
{title:'乾隆年号结束，弘历就不管事了吗？',equation:'1795：乾隆六十年<br>1796：嘉庆元年，弘历为太上皇帝<br>1799：弘历去世',body:'不能这样推断。年号归属于当时的纪年制度，实际权力却可能仍受退位皇帝影响。正式在位、年号使用、实际掌权，是三个有关联但不完全重合的时间区间。这里的“太上皇帝”是身份称号，不要硬塞进谥号或庙号。',source:'https://www.dpm.org.cn/court/lineage/226263.html'}

function moreExamples(){return `<section class="section" id="more-examples"><div class="section-head"><h2>从“叫什么”，推到“为什么”。</h2><span class="num">8 个拆解例子</span></div><p>遇到陌生称呼，先按这四步判断：</p><div class="reason-steps"><div class="reason-step"><b>01 · 看用途</b><p>在指人、算年份、安排祭祀，还是评价与尊崇？</p></div><div class="reason-step"><b>02 · 看时间</b><p>生前使用，还是身后议定？初定，还是后来加改？</p></div><div class="reason-step"><b>03 · 看范围</b><p>哪一朝、哪一个人？同一称号可能重名。</p></div><div class="reason-step"><b>04 · 查反例</b><p>惯例是否适用于这段历史？别把习惯当定律。</p></div></div><div class="worked-grid">${workedExamples.map((e,i)=>`<article class="worked-example"><span class="overline">例 ${String(i+1).padStart(2,'0')}</span><h3>${e.title}</h3><div class="worked-equation">${e.equation}</div><p>${e.body}</p><a class="source" href="${e.source}" target="_blank" rel="noopener">查看例子依据 ↗</a></article>`).join('')}</div><div class="scope-note">称号是历史信息，也包含政治立场。谥号里的“文”“武”“仁”是当时权力作出的评价与尊崇，不能拿来直接给各朝皇帝算客观分数。</div></section>`}
function catalogueSection(){return `<section class="section" id="catalogue"><div class="section-head"><h2>称号全称与年号清单。</h2><span class="num">16 人 · 32 条年号</span></div><div class="scope-note">收录范围：本册 16 位代表人物。各人的年号名称列全，长谥号列出标注版本的全称；尊号只列有出处的实例，不声称穷尽历次尊号。这里不是历代皇帝大全。以下资料全部展开，不必逐人点击。</div><div class="search"><label for="catalogue-search">查资料</label><input id="catalogue-search" type="search" placeholder="可搜完整谥号中的字，如：神功" autocomplete="off"></div><div class="catalogue-filter" role="group" aria-label="资料清单王朝筛选">${['全部','秦','西汉','唐','北宋','元','明','清'].map(d=>`<button class="chip" data-catalogue-dyn="${d}" aria-pressed="${d==='全部'}">${d}</button>`).join('')}</div><p id="catalogue-status" class="small" aria-live="polite">16 位人物 · 32 条年号记录</p><div class="catalogue-list">${catalogue.map((p,i)=>`<article class="catalogue-entry" id="catalogue-${p.id}" data-catalogue-ref="${i}"><header class="catalogue-head"><h3>${p.label} <span class="tag">${p.dyn}</span></h3><span class="num">${String(i+1).padStart(2,'0')}</span></header><p class="small">${p.name} · ${p.life}</p><dl class="catalogue-data"><dt>姓名</dt><dd>${p.name}</dd><dt>年号清单</dt><dd>${p.yearList.length?`<div class="year-tags">${p.yearList.map(([n,a,b])=>`<span class="year-tag">${n} <span class="muted">${yearSpan(a,b)}</span></span>`).join('')}</div>`:'无年号制度；“始皇二十六年”是按君主年次纪年。'}</dd><dt>庙号</dt><dd>${p.temple}</dd><dt>谥号全称</dt><dd>${p.postVersions.map(([v,t])=>`<div class="title-version"><small>${v}</small><span>${t}</span></div>`).join('')}</dd><dt>尊号等</dt><dd>${p.honorNote}${p.id==='xuanzong'?'<p class="small" style="margin-top:8px">这里列713年尊号实例；后来还有加尊号，本文不把一条实例冒称历次完整清单。</p>':''}</dd></dl><div class="callout">${p.lesson}</div><p class="catalogue-footnote">${p.note}</p>${p.id==='qianlong'?'<p class="small">版本说明：本册全谥按《清史稿》篇首文字列示，其中包含“钦明”；故宫人物页所列文字有所省略，故不在不同来源之间静默拼接。</p>':''}<div class="catalogue-links"><a href="${p.refUrl}" target="_blank" rel="noopener">人物 / 称号依据 ↗</a>${p.extraSources.map(([label,url])=>`<a href="${url}" target="_blank" rel="noopener">${label} ↗</a>`).join('')}</div></article>`).join('')}</div></section>`}
let catalogueDyn='全部';
function filterCatalogue(){const term=document.getElementById('catalogue-search').value.trim().toLowerCase();let count=0,eras=0;stage.querySelectorAll('[data-catalogue-ref]').forEach(el=>{let p=catalogue[Number(el.dataset.catalogueRef)],match=(catalogueDyn==='全部'||p.dyn.includes(catalogueDyn))&&JSON.stringify(p).toLowerCase().includes(term);el.hidden=!match;if(match){count++;eras+=p.yearList.length}});document.getElementById('catalogue-status').textContent=count?`${count} 位人物 · ${eras} 条年号记录`:'没有匹配资料。换个称呼或选择“全部”试试。'}

const questions=[{q:'“唐太宗”的“太宗”，是哪一种称呼？',options:['姓名','年号','庙号','谥号'],answer:2,ex:'它是宗庙祭祀中的称号。这个人的姓名是李世民，年号是贞观，初谥是文皇帝。'}, {q:'“康熙三年”首先告诉你什么？',options:['皇帝出生第3年','康熙纪年的第3年','皇帝即位当天起满3年','一位叫康熙的人'],answer:1,ex:'它是一种纪年。康熙元年是1662年，因此康熙三年对应1664年；玄烨则在1661年即位。'}, {q:'明英宗用了正统、天顺。说明什么？',options:['这是两个皇帝','年号就是姓名','一帝一元有例外','庙号一定不能改'],answer:2,ex:'朱祁镇两次在位，复位时改元天顺。明清通常一帝一元，但要保留例外。'}, {q:'“开元神武皇帝”这整串，应怎样理解？',options:['开元这位皇帝的姓名','一个完整的年号','李隆基的尊号','李隆基去世后的庙号'],answer:2,ex:'群臣请上的这一整串是尊号。开元作为年号时用于纪年，例如“开元三年”。用途和上下文比字面更可靠。'}];
let quizStep=0,quizScore=0,quizChosen=null;
function quizBody(){if(quizStep>=questions.length)return `<span class="overline">完成 / 4 道题</span><h3>你答对了 ${quizScore} 题。</h3><p>判断称呼时，先问它在指人、标时间、定祭祀称呼，还是在作评价与尊崇。</p><button class="btn" data-quiz-restart>再试一次 ↻</button>`;let q=questions[quizStep];return `<div class="section-head"><span class="overline">用理解，代替死记</span><span class="num">${quizStep+1} / 4</span></div><h3>${q.q}</h3><div class="quiz-options">${q.options.map((o,i)=>`<button class="quiz-option" data-answer="${i}" aria-pressed="${quizChosen===i}" ${quizChosen!==null?'disabled':''}>${String.fromCharCode(65+i)} · ${o}</button>`).join('')}</div><div class="quiz-result" role="status">${quizChosen===null?'选一个答案，看看解释。':`<b>${quizChosen===q.answer?'判断正确。':'再想一层：正确答案是 '+q.options[q.answer]+'。'}</b> ${q.ex}`}</div>${quizChosen!==null?`<div class="quiz-footer"><span class="small">${quizChosen===q.answer?'你抓住了这个字段的用途。':'看懂解释，比一次选对更重要。'}</span><button class="btn primary" data-quiz-next>${quizStep===3?'看结果':'下一题'} →</button></div>`:''}`}
function chronology(){let all=catalogue.flatMap(p=>p.yearList.map(([name,start,end])=>({name,start,end,person:p.name.replace('爱新觉罗·',''),dyn:p.dyn}))).sort((a,b)=>a.start-b.start);return `<section class="section" id="reference-years"><div class="section-head"><h2>年号参考表。</h2><span class="num">32 条 · 全部显示</span></div><p class="small">本册16人的年号清单，按起始年份排列。以下为涉及的公元年份；年中改元会使相邻年号共享同一年，不等于月份重复。宣统列到1912年退位；早期汉代纪年依传统建元表，不用来断言当时的命名时点。</p><table class="chronology"><thead><tr><th scope="col">公元年份</th><th scope="col">年号</th><th scope="col">人物</th></tr></thead><tbody>${all.map(y=>`<tr><td>${yearSpan(y.start,y.end)}</td><td>${y.name}</td><td>${y.person}</td></tr>`).join('')}</tbody></table><a class="source" href="https://agri-history.ihns.ac.cn/history/historic%20table.htm" target="_blank" rel="noopener">中科院自然科学史研究所网站：历代年号索引表 ↗</a>${source('years','《辞源》建元表对照')}</section>`}

function common(){return `<div class="common">${references()}${moreExamples()}${catalogueSection()}${chronology()}${current===0?`<section class="section card">${calculator()}</section>`:''}<section class="section" id="quiz"><div class="section-head"><h2>真的分清了吗？</h2><span class="num">TRY IT</span></div><div class="quiz" id="quiz-body">${quizBody()}</div></section><footer class="footer"><div class="overline">关于这本小册</div><h3 style="margin-top:10px">模型要清楚，例外也要留下。</h3><p class="small">五分类是帮助入门的分析工具，不是中国历代制度始终一致的证明。本文区分在位年份与年号年份、全称与简称、初定与后改；示意图为原创解释图，不是文物或真实人物画像。</p><details><summary>资料与阅读边界</summary><p class="small">人物信息参考故宫博物院，纪年参考商务印书馆《辞源》历代建元表，制度案例参考古籍与故宫研究资料。部分 PDF 与古籍网站可能受访问限制。小册内容仍在持续核查中，欢迎对照所列依据复核。</p><ul class="source-list"><li><a href="${sources.qin}" target="_blank" rel="noopener">《史记·秦始皇本纪》</a>：始皇帝称号与废除谥法</li><li><a href="${sources.han}" target="_blank" rel="noopener">《汉书·武帝纪》</a>：刘彻、孝武与纪年</li><li><a href="${sources.tang}" target="_blank" rel="noopener">故宫：李世民</a> · <a href="${sources.tangshi}" target="_blank" rel="noopener">唐代帝王谥号研究资料</a>：初谥、后世加谥</li><li><a href="${sources.honor}" target="_blank" rel="noopener">《全唐文》：请加开元神武尊号表</a>：尊号与年号的语境</li><li><a href="${sources.mingwu}" target="_blank" rel="noopener">故宫：洪武皇帝</a> · <a href="${sources.ming}" target="_blank" rel="noopener">永乐皇帝</a> · <a href="${sources.ying}" target="_blank" rel="noopener">天顺皇帝</a></li><li><a href="${sources.qing}" target="_blank" rel="noopener">故宫：康熙皇帝</a>：玄烨、圣祖、仁皇帝</li><li><a href="${sources.years}" target="_blank" rel="noopener">商务印书馆：《辞源》历代建元表</a> · <a href="${sources.repeat}" target="_blank" rel="noopener">故宫：“至元”年号重名</a></li><li><a href="https://www.neac.gov.cn/seac/c103391/202304/1162337.shtml" target="_blank" rel="noopener">国家民委：“天可汗”的政治语境</a></li></ul></details><p class="small">帝号 · 移动端概念小册 · v__APP_VERSION__ / 内容核查日期：2026-10-07</p><p class="small"><a href="https://github.com/holynova/dihao" target="_blank" rel="noopener">GitHub 源码 ↗</a> · <a href="/data/history-catalogue.json" download>下载人物资料 JSON ↓</a></p></footer></div>`}
const variants=[()=>{quizStep=0;quizScore=0;quizChosen=null;catalogueDyn='全部';return editorial()},()=>{labPerson=2;labField=1;quizStep=0;quizScore=0;quizChosen=null;catalogueDyn='全部';return lab()},()=>{eraIndex=2;quizStep=0;quizScore=0;quizChosen=null;catalogueDyn='全部';return timeline()}];
const initialUrl=new URL(location);const initialVariant=Number(initialUrl.searchParams.get('v'));if(!Number.isInteger(initialVariant)||initialVariant<1||initialVariant>3){initialUrl.searchParams.set('v','1');history.replaceState(null,'',initialUrl)}
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item')];
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

new MutationObserver(()=>{if(!stage.children.length)return;const anchor=location.hash?document.getElementById(location.hash.slice(1)):null;if(anchor)anchor.scrollIntoView({block:'start',behavior:'instant'});else window.scrollTo({top:0,behavior:'instant'});}).observe(stage,{childList:true});
// Product interactions are isolated from the fixed picker harness.
stage.addEventListener('click',e=>{
 const dynasty=e.target.closest('[data-catalogue-dyn]');if(dynasty){catalogueDyn=dynasty.dataset.catalogueDyn;stage.querySelectorAll('[data-catalogue-dyn]').forEach(b=>b.setAttribute('aria-pressed',String(b===dynasty)));filterCatalogue();}
 const concept=e.target.closest('[data-concept]');if(concept){stage.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b===concept)));document.getElementById('concept-panel').innerHTML=conceptPanel(Number(concept.dataset.concept));}
 const person=e.target.closest('[data-person]');if(person){labPerson=Number(person.dataset.person);stage.querySelectorAll('[data-person]').forEach(b=>b.setAttribute('aria-pressed',String(b===person)));document.getElementById('lab-board').innerHTML=board();}
 const field=e.target.closest('[data-field]');if(field){labField=Number(field.dataset.field);stage.querySelectorAll('[data-field]').forEach(b=>b.setAttribute('aria-pressed',String(b===field)));stage.querySelector('.lab-detail').innerHTML=labDetail();}
 const era=e.target.closest('[data-era]');if(era){selectEra(Number(era.dataset.era));}
 const answer=e.target.closest('[data-answer]');if(answer&&quizChosen===null){quizChosen=Number(answer.dataset.answer);if(quizChosen===questions[quizStep].answer)quizScore++;document.getElementById('quiz-body').innerHTML=quizBody();document.querySelector('[data-quiz-next]')?.focus({preventScroll:true});}
 if(e.target.closest('[data-quiz-next]')){quizStep++;quizChosen=null;document.getElementById('quiz-body').innerHTML=quizBody();document.querySelector('[data-answer],[data-quiz-restart]')?.focus({preventScroll:true});}
 if(e.target.closest('[data-quiz-restart]')){quizStep=0;quizScore=0;quizChosen=null;document.getElementById('quiz-body').innerHTML=quizBody();document.querySelector('[data-answer]')?.focus({preventScroll:true});}
});
function selectEra(i){eraIndex=i;stage.querySelectorAll('[data-era]').forEach((b,j)=>{b.setAttribute('aria-selected',String(j===i));b.tabIndex=j===i?0:-1});let panel=document.getElementById('era-panel');panel.setAttribute('aria-labelledby','era-tab-'+i);panel.innerHTML=eraPanel()}
stage.addEventListener('keydown',e=>{if(e.target.matches('[data-era]')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();e.stopPropagation();let n=e.key==='Home'?0:e.key==='End'?4:(Number(e.target.dataset.era)+(e.key==='ArrowRight'?1:4))%5;selectEra(n);document.getElementById('era-tab-'+n).focus();}});
stage.addEventListener('input',e=>{if(e.target.id==='catalogue-search')filterCatalogue();if(e.target.id==='person-search'){let term=e.target.value.trim().toLowerCase(),count=0;stage.querySelectorAll('[data-ref]').forEach(d=>{let p=catalogue[Number(d.dataset.ref)],show=Object.values(p).join(' ').toLowerCase().includes(term);d.hidden=!show;if(show)count++});document.getElementById('search-status').textContent=count?`${count} 位匹配人物`:'没有匹配人物。试试姓名、庙号或年号。';}if(e.target.id==='year-num')updateYear();});
stage.addEventListener('change',e=>{if(e.target.id==='year-era'){let y=years[Number(e.target.value)];document.getElementById('year-num').max=y.end-y.start+1;updateYear()}});
function updateYear(){let i=Number(document.getElementById('year-era').value),raw=document.getElementById('year-num').value,n=raw===''?NaN:Number(raw);document.getElementById('year-answer').innerHTML=calcResult(i,n)}
