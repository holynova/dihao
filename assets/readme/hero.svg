<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">帝号 — 一个皇帝，为什么有这么多名字？姓名、年号、庙号、谥号与尊号图解</title>
  <desc id="desc">宣纸底黛绿字的标题：帝号，把皇帝的称呼读明白；右侧是关系图：同一个人李世民，年号贞观、庙号太宗、谥号文皇帝。</desc>

  <rect width="1200" height="360" rx="26" fill="#f5f1e8"/>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#1f5c40">中国历史称呼科普 · IMPERIAL TITLES, EXPLAINED</text>
    <text x="56" y="128" font-size="58" font-weight="700" fill="#1c2b23">帝号</text>
    <text x="56" y="168" font-size="23" fill="#1c2b23">一个皇帝，为什么有这么多名字？</text>
    <text x="56" y="204" font-size="19" fill="#57534e">李世民、唐太宗、贞观——它们回答的根本不是同一个问题。</text>
    <g id="chips" font-size="18" fill="#1c2b23" text-anchor="middle">
      <g><rect x="56" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/><text x="119" y="262">16 位代表人物</text></g>
      <g><rect x="194" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/><text x="257" y="262">32 条年号记录</text></g>
      <g><rect x="332" y="238" width="126" height="36" rx="18" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/><text x="395" y="262">8 组推理案例</text></g>
      <g><rect x="470" y="238" width="126" height="36" rx="18" fill="#1f5c40"/><text x="533" y="262" fill="#ffffff">4 道小测验</text></g>
    </g>
  </g>

  <g id="diagram" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g id="diagram-shapes">
      <rect x="780" y="44" width="360" height="272" rx="16" fill="#ffffff" stroke="#ddd6c4" stroke-width="1.5"/>
      <rect x="904" y="76" width="112" height="56" rx="8" fill="#dcefe3" stroke="#1f5c40" stroke-width="2"/>
      <rect x="804" y="196" width="96" height="64" rx="8" fill="#f5f1e8" stroke="#ddd6c4" stroke-width="1.5"/>
      <rect x="912" y="196" width="96" height="64" rx="8" fill="#f5f1e8" stroke="#ddd6c4" stroke-width="1.5"/>
      <rect x="1020" y="196" width="96" height="64" rx="8" fill="#f5f1e8" stroke="#ddd6c4" stroke-width="1.5"/>
      <line x1="960" y1="132" x2="960" y2="160" stroke="#1f5c40" stroke-width="2"/>
      <line x1="852" y1="160" x2="1068" y2="160" stroke="#1f5c40" stroke-width="2"/>
      <line x1="852" y1="160" x2="852" y2="196" stroke="#1f5c40" stroke-width="2"/>
      <line x1="960" y1="160" x2="960" y2="196" stroke="#1f5c40" stroke-width="2"/>
      <line x1="1068" y1="160" x2="1068" y2="196" stroke="#1f5c40" stroke-width="2"/>
    </g>
    <g id="diagram-labels">
      <text x="804" y="68" font-size="18" fill="#57534e">同一个人 · 不同字段</text>
      <text x="960" y="113" font-size="24" font-weight="700" fill="#1f5c40" text-anchor="middle">李世民</text>
      <text x="852" y="226" font-size="20" font-weight="700" fill="#1c2b23" text-anchor="middle">贞观</text>
      <text x="852" y="250" font-size="18" fill="#57534e" text-anchor="middle">年号 · 纪年</text>
      <text x="960" y="226" font-size="20" font-weight="700" fill="#1c2b23" text-anchor="middle">太宗</text>
      <text x="960" y="250" font-size="18" fill="#57534e" text-anchor="middle">庙号 · 祭祀</text>
      <text x="1068" y="226" font-size="20" font-weight="700" fill="#1c2b23" text-anchor="middle">文皇帝</text>
      <text x="1068" y="250" font-size="18" fill="#57534e" text-anchor="middle">谥号 · 评价</text>
      <text x="804" y="300" font-size="18" fill="#57534e">三个称呼不是三个人</text>
    </g>
  </g>
</svg>
